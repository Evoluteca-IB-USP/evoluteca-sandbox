<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Navbar · v9, a estante</title>
  <link rel="icon" type="image/png" href="../../imagens/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../aparencia/__pacote__.css">
  <link rel="stylesheet" href="comum/pagina-de-exemplo.css">
  <link rel="stylesheet" href="comum/cabecalho-limpo.css">
  <link rel="stylesheet" href="v9-estante.css">
  <script type="importmap">
    { "imports": { "r": "../../motor-de-simuladores/r/__pacote__.js", "escrever-html": "../../escrever-html/__pacote__.js", "portugues": "../../portugues/__pacote__.js" } }
  </script>
</head>
<body>
  <div class="usp-faixa-amarela"></div>
  <div class="usp-faixa-azul"></div>
  <div class="usp-barra">
    <div class="container usp-barra-inner">
      <a class="usp-logo" href="https://www.ib.usp.br" rel="external" title="Instituto de Biociências da USP"><img src="../../imagens/simbolo_ib_bco.png" alt="Instituto de Biociências da USP" class="usp-logo-ib"></a>
      <a class="usp-logo" href="https://www5.usp.br" rel="external" title="Universidade de São Paulo"><img src="../../imagens/logo_usp_bco.png" alt="Universidade de São Paulo" class="usp-logo-usp"></a>
    </div>
  </div>

  <header class="topo topo-limpo topo-estante">
    <div class="container topo-inner">
      <a class="marca" href="#inicio">
        <span class="marca-nome">Evoluteca</span>
        <span class="marca-sub">Instituto de Biociências · USP</span>
      </a>
      <form class="pilula" role="search" aria-label="Principal">
        <svg class="pilula-lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <label for="destino">Procuro</label>
        <input id="destino" class="pilula-campo" type="text" autocomplete="off" spellcheck="false" placeholder="um simulador, um tema…">
        <div class="pilula-painel" hidden></div>
      </form>
    </div>
  </header>

  <main class="container exemplo"></main>

  <script type="module">
    import { montarPaginaDeMentira } from "./comum/site-de-mentira.js";
    import { montarEstante } from "./v9-estante.js";
    montarPaginaDeMentira(document.querySelector("main"));
    montarEstante(document.querySelector(".topo"));
  </script>
</body>
</html>
